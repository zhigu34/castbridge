name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and Python scripts
        run: |
          bash -n deploy.sh
          bash -n receiver/entrypoint.sh
          bash -n scripts/download-uxplay.sh
          python3 -m py_compile receiver/media_bridge.py
      - name: Validate Docker Compose
        run: cp .env.example .env && docker compose config >/dev/null

  receiver-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache UxPlay source archive
        uses: actions/cache@v4
        with:
          path: vendor/uxplay/uxplay-v1.73.7.tar.gz
          key: uxplay-source-v1.73.7
      - name: Prepare UxPlay source archive
        env:
          GITHUB_PROXY_PROMPT: "0"
        run: bash scripts/download-uxplay.sh 1.73.7
      - name: Build UxPlay receiver and media runtime image
        run: >-
          docker build
          --build-arg UXPLAY_VERSION=1.73.7
          --build-arg UXPLAY_ARCHIVE=vendor/uxplay/uxplay-v1.73.7.tar.gz
          -f receiver/Dockerfile .
