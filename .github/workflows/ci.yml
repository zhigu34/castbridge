name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and Python scripts
        run: |
          bash -n deploy.sh
          bash -n receiver/entrypoint.sh
          bash -n scripts/download-uxplay.sh
          python3 -m py_compile receiver/media_bridge.py
      - name: Validate Docker Compose
        run: cp .env.example .env && docker compose config >/dev/null

  receiver-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache UxPlay source archive
        uses: actions/cache@v4
        with:
          path: vendor/uxplay/uxplay-v1.73.7.tar.gz
          key: uxplay-source-v1.73.7
      - name: Prepare UxPlay source archive
        env:
          GITHUB_PROXY_PROMPT: "0"
        run: bash scripts/download-uxplay.sh 1.73.7
      - name: Build UxPlay receiver and media runtime image
        run: >-
          docker build
          -t castbridge-receiver-ci
          --build-arg UXPLAY_VERSION=1.73.7
          --build-arg UXPLAY_ARCHIVE=vendor/uxplay/uxplay-v1.73.7.tar.gz
          -f receiver/Dockerfile .
      - name: Smoke test WebRTC runtime and viewer lifecycle
        run: |
          docker run --rm --entrypoint python3 castbridge-receiver-ci -c '
          import asyncio
          import importlib.util
          import gi
          import websockets

          gi.require_version("Gst", "1.0")
          from gi.repository import Gst

          Gst.init(None)
          for element in (
              "webrtcbin",
              "nicesrc",
              "rtph264depay",
              "rtph264pay",
              "avdec_h264",
              "videoconvert",
              "x264enc",
          ):
              assert Gst.ElementFactory.find(element) is not None, element

          spec = importlib.util.spec_from_file_location(
              "castbridge_media_bridge",
              "/usr/local/lib/castbridge/media_bridge.py",
          )
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          async def lifecycle():
              bridge = module.MediaBridge()
              bridge.start_source()
              source_pipeline = bridge.source_pipeline
              assert source_pipeline is not None
              bridge.start_viewer("smoke-viewer")
              assert bridge.viewer_pipeline is not None
              bridge.stop_viewer()
              assert bridge.viewer_pipeline is None
              assert bridge.source_pipeline is source_pipeline
              bridge.stop_source()
              assert bridge.source_pipeline is None

          asyncio.run(lifecycle())
          print("WebRTC runtime and split lifecycle OK")
          '
