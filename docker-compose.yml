name: castbridge

services:
  receiver:
    image: castbridge-receiver:local
    build:
      context: .
      dockerfile: receiver/Dockerfile
      args:
        DEBIAN_BASE_IMAGE: ${DEBIAN_BASE_IMAGE:-debian:bookworm-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
        UXPLAY_VERSION: ${UXPLAY_VERSION:-1.73.7}
        UXPLAY_ARCHIVE: vendor/uxplay/uxplay-v${UXPLAY_VERSION:-1.73.7}.tar.gz
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: castbridge-receiver
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UXPLAY_VERSION: ${UXPLAY_VERSION:-1.73.7}
      CASTBRIDGE_RECEIVER_NAME: ${CASTBRIDGE_RECEIVER_NAME:-CastBridge}
      CASTBRIDGE_AIRPLAY_PORT: ${CASTBRIDGE_AIRPLAY_PORT:-7100}
      CASTBRIDGE_AIRPLAY_FPS: ${CASTBRIDGE_AIRPLAY_FPS:-60}
      CASTBRIDGE_RTP_VIDEO_PORT: ${CASTBRIDGE_RTP_VIDEO_PORT:-5000}
      CASTBRIDGE_RTP_AUDIO_PORT: ${CASTBRIDGE_RTP_AUDIO_PORT:-5002}
      CASTBRIDGE_MDNS_MODE: ${CASTBRIDGE_MDNS_MODE:-auto}
      CASTBRIDGE_HOST_DBUS_SOCKET: /host/run/dbus/system_bus_socket
      CASTBRIDGE_RUN_DIR: /run/castbridge
      CASTBRIDGE_LOG_DIR: /var/log/castbridge
    volumes:
      - /run/dbus:/host/run/dbus:ro
      - ./run:/run/castbridge
      - ./logs:/var/log/castbridge
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/castbridge/receiver.pid && kill -0 $$(cat /run/castbridge/receiver.pid) && test -f /run/castbridge/receiver-discovery.ready"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s

  media:
    image: castbridge-receiver:local
    container_name: castbridge-media
    init: true
    restart: unless-stopped
    network_mode: host
    entrypoint: ["python3", "/usr/local/lib/castbridge/media_bridge.py"]
    depends_on:
      receiver:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CASTBRIDGE_RTP_VIDEO_PORT: ${CASTBRIDGE_RTP_VIDEO_PORT:-5000}
      CASTBRIDGE_WEBRTC_SIGNALING_URL: ws://127.0.0.1:${CASTBRIDGE_WEB_PORT:-8090}/ws/media
      CASTBRIDGE_RUN_DIR: /run/castbridge
    volumes:
      - ./run:/run/castbridge
      - ./logs:/var/log/castbridge
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -s /run/castbridge/media-status.json"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: castbridge-backend
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CASTBRIDGE_ENVIRONMENT: ${CASTBRIDGE_ENVIRONMENT:-production}
      CASTBRIDGE_RECEIVER_NAME: ${CASTBRIDGE_RECEIVER_NAME:-CastBridge}
      CASTBRIDGE_LOG_LEVEL: ${CASTBRIDGE_LOG_LEVEL:-INFO}
      CASTBRIDGE_RECEIVER_STATUS_FILE: /run/castbridge/receiver-status.json
      CASTBRIDGE_RECEIVER_STALE_SECONDS: ${CASTBRIDGE_RECEIVER_STALE_SECONDS:-10}
      CASTBRIDGE_MEDIA_STATUS_FILE: /run/castbridge/media-status.json
      CASTBRIDGE_MEDIA_STALE_SECONDS: ${CASTBRIDGE_MEDIA_STALE_SECONDS:-5}
    volumes:
      - ./run:/run/castbridge:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: castbridge-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CASTBRIDGE_WEB_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
